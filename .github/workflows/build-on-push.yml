name: build-on-push

on:
  push:
    branches: [ "develop", "main" ]

env:
  MAVEN_OPTS: -Djava.security.egd=file:/dev/./urandom

permissions:
  contents: write

jobs:
  build:
    name: Build and release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # develop is the quality gate only (no deploy). main cuts the signed
      # release to Maven Central. Both resolve the upstream libs from Central (public).
      - name: Build and test (develop)
        if: github.ref_name != 'main'
        run: ./mvnw --batch-mode -Ppublish clean verify

      # ---- release path: main only ----
      - name: Import GPG signing key
        if: github.ref_name == 'main'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Configure Maven settings for the Central Portal
        if: github.ref_name == 'main'
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>central</id>
                <username>${env.CENTRAL_TOKEN_USERNAME}</username>
                <password>${env.CENTRAL_TOKEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          XML

      # The Central Portal only accepts release versions; strip the -SNAPSHOT
      # develop carries. A version can be published to Central only once, so
      # every release merge to main must bump the version on develop first.
      - name: Strip -SNAPSHOT for release
        if: github.ref_name == 'main'
        run: ./mvnw --batch-mode versions:set -DremoveSnapshot -DgenerateBackupPoms=false

      - name: Build, sign and publish to Maven Central
        if: github.ref_name == 'main'
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw --batch-mode -Ppublish,release clean deploy

      - name: Tag release
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(./mvnw --quiet help:evaluate -Dexpression=project.version -DforceStdout)
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/v${VERSION}" -f sha="${GITHUB_SHA}"
