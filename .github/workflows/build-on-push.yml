name: build-on-push

on:
  push:
    branches: [ "develop", "main" ]

env:
  MAVEN_OPTS: -Djava.security.egd=file:/dev/./urandom

jobs:
  publish:
    name: Build and publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # Same two-server settings as the PR validation: read corrcalc-lib-core + graphs-algos-lib
      # and write this repo's package, all via PACKAGES_TOKEN.
      - name: Configure Maven settings for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.PACKAGES_TOKEN}</password>
              </server>
              <server>
                <id>github-graphs</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML

      - name: Build, test and deploy the SNAPSHOT
        run: ./mvnw --batch-mode -Ppublish clean deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
