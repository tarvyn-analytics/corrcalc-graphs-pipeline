name: validate-on-pull-request

on:
  pull_request:
    branches: [ "develop", "main" ]
    types: [opened, reopened, synchronize]

env:
  MAVEN_OPTS: -Djava.security.egd=file:/dev/./urandom

jobs:
  verify:
    name: Verify PR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # The pipeline resolves TWO private GitHub-Packages artifacts — corrcalc-lib-core (S1)
      # and graphs-algos-lib (S3) — under repository ids `github` and `github-graphs`. Maven
      # matches a server to a repository by id, so settings.xml carries one server per id, both
      # authenticated by PACKAGES_TOKEN (a PAT with read:packages on tarvyn-analytics/corrcalc-lib
      # and tarvyn-analytics/graphs-algos-lib, plus write:packages on this repo for the publish
      # job). The default GITHUB_TOKEN cannot read another repository's private package.
      - name: Configure Maven settings for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.PACKAGES_TOKEN}</password>
              </server>
              <server>
                <id>github-graphs</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # -Ppublish builds the source and javadoc jars too, so a PR cannot merge with javadoc
      # errors that would break publishing on push. sonar:sonar runs after verify so the JaCoCo
      # XML report is in place; SonarCloud org/host/projectKey come from the pom.
      - name: Build, test, enforce coverage and analyze with SonarCloud
        run: >
          ./mvnw --batch-mode -Ppublish clean verify sonar:sonar
          -Dsonar.working.directory=.scannerwork
          -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
          -Dsonar.pullrequest.branch=${{ github.head_ref }}
          -Dsonar.pullrequest.base=${{ github.base_ref }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: 'target/site/jacoco/'
          retention-days: 14

      - name: SonarCloud Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
